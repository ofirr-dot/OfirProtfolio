<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תיק Ofir</title>
<meta name="description" content="ניהול תיק השקעות — IBKR, TASE, FAIR">
<meta name="theme-color" content="#2D5BFF">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תיק Ofir">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #F0F2F8; overflow: hidden;
    font-family: 'Heebo', -apple-system, sans-serif;
  }
  #frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: none;
    background: #F0F2F8;
  }
  #loader {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; background: #F0F2F8;
    transition: opacity 0.4s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .logo { font-size: 42px; font-weight: 900; color: #0F1729; }
  .logo em { color: #2D5BFF; font-style: normal; }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid #E0E6F2; border-top-color: #2D5BFF;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  .hint { color: #5A6B92; font-size: 15px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ═══ שער טביעת אצבע — v2 ═══ */
  #lock {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(160deg, #F0F2F8 0%, #E8F0FF 100%);
    transition: opacity 0.35s ease;
  }
  #lock.hide { opacity: 0; pointer-events: none; }
  .lock-card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 24px;
    padding: 40px 28px 32px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(45,91,255,0.12);
    animation: rise 0.4s ease;
  }
  @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .lock-logo { font-size: 36px; font-weight: 900; color: #0F1729; margin-bottom: 6px; }
  .lock-logo em { color: #2D5BFF; font-style: normal; }
  .lock-title { font-size: 19px; font-weight: 700; color: #0F1729; margin: 10px 0 8px; }
  .lock-sub { font-size: 15px; color: #5A6B92; line-height: 1.6; margin-bottom: 26px; }
  .bio-btn {
    width: 92px; height: 92px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #2D5BFF 0%, #1A47E0 100%);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(45,91,255,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .bio-btn:active { transform: scale(0.92); }
  .bio-btn svg { width: 44px; height: 44px; }
  .bio-btn.busy { animation: pulse 1.2s ease infinite; pointer-events: none; }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 24px rgba(45,91,255,0.35); } 50% { box-shadow: 0 6px 34px rgba(45,91,255,0.6); } }
  .lock-err { min-height: 20px; font-size: 14px; color: #E8394A; margin-top: 14px; }
  .lock-fallback {
    display: inline-block; margin-top: 6px;
    font-size: 14px; color: #5A6B92;
    text-decoration: underline; cursor: pointer;
  }
</style>
</head>
<body>

<!-- שער טביעת אצבע -->
<div id="lock">
  <div class="lock-card">
    <div class="lock-logo">תיק <em>Ofir</em></div>
    <div class="lock-title" id="lockTitle">כניסה מהירה עם טביעת אצבע</div>
    <div class="lock-sub" id="lockSub">פתח את האפליקציה בנגיעה — בלי קוד.</div>
    <button class="bio-btn" id="bioBtn" aria-label="טביעת אצבע">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 11c0-1.9.94-3.6 2.4-4.7"/>
        <path d="M6.2 11a7 7 0 0 1 3.2-5.9"/>
        <path d="M9.7 16.5c-.3-1-.4-2.1-.2-3.2"/>
        <path d="M6.2 16.5c-.5-1.7-.6-3.5-.1-5.3"/>
        <path d="M12.9 20.7c-1.2-.6-2.3-1.4-3.2-2.4"/>
        <path d="M12 14.5c.1-1.7.8-3.3 2-4.4"/>
        <path d="M15.7 20.3c-1.1-.4-2.1-1-3-1.8"/>
        <path d="M15.5 15.4c.4-1.4 1.3-2.6 2.5-3.3"/>
        <path d="M17.7 18.9c-.7-.4-1.4-1-2-1.6"/>
        <path d="M19.4 16.8c-.2-.2-.4-.5-.5-.7"/>
      </svg>
    </button>
    <div class="lock-err" id="lockErr"></div>
    <a class="lock-fallback" id="lockFallback">כניסה בקוד PIN בלבד</a>
  </div>
</div>

<!-- מסך טעינה -->
<div id="loader">
  <div class="logo">תיק <em>Ofir</em></div>
  <div class="spinner"></div>
  <div class="hint">טוען את התיק…</div>
</div>

<iframe id="frame" title="תיק Ofir"
        allow="clipboard-read; clipboard-write; fullscreen; publickey-credentials-create *; publickey-credentials-get *"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  /* ═══════════════════════════════════════════════════════════════
     כתובת האפליקציה — ה-/exec של הדפלוימנט הפעיל שלך.
     אם אי פעם יצרת דפלוימנט חדש ב-Apps Script: פתח את האתר
     הרגיל, העתק את הכתובת משורת הכתובת (היא מסתיימת ב-/exec)
     והדבק אותה כאן במקום. זה הכל.
     ═══════════════════════════════════════════════════════════════ */
  var APP_EMBED_URL = 'https://script.google.com/macros/s/AKfycbz9rChZIM95O2FTNdw0W9P2Iir5wRYggO4nf5Jk2dH2wiNz_Iun18X2jeFZ7KQq2YqdRA/exec'; // ✅ v4: הפריסה הפעילה (זו שאתה מעדכן)

  /* ✅ v3: cache-buster — כל טעינה של האפליקציה מקבלת כתובת ייחודית,
     כך שהדפדפן בטלפון לעולם לא יגיש את הגרסה הקודמת מהמטמון שלו. */
  function appUrl() {
    // ✅ v4: shell=1 מסמן לאפליקציה שהיא בתוך המעטפת (מפעיל זכירת מכשיר) + ריענון מטמון
    return APP_EMBED_URL + (APP_EMBED_URL.indexOf('?') >= 0 ? '&' : '?') + 'rv=' + Date.now() + '&shell=1';
  }

  var frame = document.getElementById('frame');
  var loader = document.getElementById('loader');
  var lock = document.getElementById('lock');
  var lockTitle = document.getElementById('lockTitle');
  var lockSub = document.getElementById('lockSub');
  var lockErr = document.getElementById('lockErr');
  var bioBtn = document.getElementById('bioBtn');
  var fallback = document.getElementById('lockFallback');

  var CRED_KEY = 'shellCredId';
  var relockMode = false;   // true = האפליקציה ננעלה בזמן שימוש
  var bioBroken = false;    // true = WebAuthn לא זמין במכשיר
  var appLoaded = false;

  /* ── עזרים ── */
  function b64(buf) {
    var bytes = new Uint8Array(buf);
    var s = '';
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  }
  function unb64(s) {
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function bioAvailable() {
    return !!(navigator.credentials && window.PublicKeyCredential);
  }

  /* ── חשיפת האפליקציה אחרי אימות ── */
  function unlockShell() {
    lock.classList.add('hide');
    if (!appLoaded) frame.src = appUrl();
  }

  /* ── מצבי שער ── */
  function showLock(opts) {
    opts = opts || {};
    relockMode = !!opts.relock;
    var credId = localStorage.getItem(CRED_KEY);

    if (relockMode) {
      lockTitle.textContent = 'האפליקציה נעלה';
      lockSub.textContent = 'אשר טביעת אצבע כדי לחזור לתיק';
    } else if (credId) {
      lockTitle.textContent = 'כניסה מהירה עם טביעת אצבע';
      lockSub.textContent = 'נגע בחיישן כדי לפתוח את התיק';
    } else {
      lockTitle.textContent = 'ברוך הבא!';
      lockSub.textContent = 'הפעל כניסה מהירה עם טביעת אצבע — הקוד יישאר כגיבוי';
    }
    lock.classList.remove('hide');
    lockErr.textContent = '';
    fallback.style.display = (credId && !relockMode && !bioBroken) ? 'none' : 'inline-block';

    /* ניסיון אוטומטי ראשון — שהדיאלוג יופיע מיד עם הפתיחה */
    if (credId && bioAvailable()) setTimeout(tryUnlock, 350);
  }

  /* ── רישום טביעת אצבע (פעם ראשונה) ── */
  async function tryEnroll() {
    lockErr.textContent = '';
    bioBtn.classList.add('busy');
    try {
      var challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
      var userId = new Uint8Array(16); crypto.getRandomValues(userId);
      var credential = await navigator.credentials.create({ publicKey: {
        challenge: challenge,
        rp: { name: 'תיק Ofir', id: location.hostname },
        user: { id: userId, name: 'Ofir', displayName: 'Ofir' },
        pubKeyCredParams: [ { type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 } ],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
        attestation: 'none'
      }});
      localStorage.setItem(CRED_KEY, b64(credential.rawId));
      bioBtn.classList.remove('busy');
      unlockShell();
    } catch (e) {
      bioBtn.classList.remove('busy');
      handleBioError(e, true);
    }
  }

  /* ── פתיחה עם טביעת אצבע ── */
  async function tryUnlock() {
    var credId = localStorage.getItem(CRED_KEY);
    if (!credId) { tryEnroll(); return; }
    lockErr.textContent = '';
    bioBtn.classList.add('busy');
    try {
      var challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
      await navigator.credentials.get({ publicKey: {
        challenge: challenge,
        rpId: location.hostname,
        allowCredentials: [ { type: 'public-key', id: unb64(credId) } ],
        userVerification: 'required',
        timeout: 60000
      }});
      bioBtn.classList.remove('busy');
      if (relockMode) {
        /* חזרה מנעילת חוסר-פעילות — ריענון האפליקציה וכניסה אוטומטית עם הטוקן הזכור */
        frame.src = appUrl();
        loader.classList.remove('hide');
        lock.classList.add('hide');
        setTimeout(function () { appLoaded = false; }, 100);
      } else {
        unlockShell();
      }
    } catch (e) {
      bioBtn.classList.remove('busy');
      handleBioError(e, false);
    }
  }

  /* ── טיפול בשגיאות ── */
  function handleBioError(e, isEnroll) {
    console.error('WebAuthn:', e.name, e.message);
    if (e.name === 'NotAllowedError' || e.name === 'AbortError') {
      lockErr.textContent = 'בוטל — נסה שוב';
      return;
    }
    if (e.name === 'InvalidStateError') {
      lockErr.textContent = 'טביעה כבר רשומה — נסה לפתוח שוב';
      return;
    }
    /* כשל אמיתי (ללא חיישן / דפדפן לא תומך) — מציגים מסלול קוד */
    bioBroken = true;
    lockErr.textContent = 'טביעת אצבע לא זמינה — ניתן להיכנס בקוד';
    fallback.style.display = 'inline-block';
  }

  bioBtn.addEventListener('click', function () {
    if (localStorage.getItem(CRED_KEY)) tryUnlock();
    else tryEnroll();
  });

  fallback.addEventListener('click', function () {
    unlockShell(); /* הקוד/PIN ייבדק בתוך האפליקציה */
  });

  /* ── הודעת נעילה מהאפליקציה (בקשר לאירוע visibility/auto-lock) ── */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.cmd !== 'app-locked') return;
    try {
      if (e.origin !== 'null') {
        var host = new URL(e.origin).hostname;
        if (!/\.googleusercontent\.com$/.test(host)) return;
      }
    } catch (err) { return; }
    showLock({ relock: true });
  });

  /* ── מסך טעינה ── */
  function hideLoader() {
    loader.classList.add('hide');
  }
  frame.addEventListener('load', function () {
    appLoaded = true;
    setTimeout(hideLoader, 600);
  });
  setTimeout(hideLoader, 15000);

  /* ── אתחול ── */
  if (!bioAvailable()) {
    bioBroken = true;
    bioBtn.style.display = 'none';
    lockSub.textContent = 'המכשיר לא תומך בטביעת אצבע — כניסה בקוד';
  }
  showLock();

  /* טעינה מקדימה של האפליקציה מאחורי השער (לא נחשפת עד אימות) */
  frame.src = appUrl();
  appLoaded = true;

  /* Service Worker — חובה להתקנה אמיתית כאפליקציה */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (e) {
      console.warn('SW registration failed:', e);
    });
  }
</script>
</body>
</html>
